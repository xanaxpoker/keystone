name: Keystone macOS
on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Mac architecture to build
        type: choice
        default: both
        options: [both, arm64, x86_64]
  push:
    branches: [keystone-ui]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.architecture == 'arm64' && '["arm64"]' || inputs.architecture == 'x86_64' && '["x86_64"]' || '["arm64","x86_64"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'macos-14' || 'macos-15-intel' }}
    timeout-minutes: 180
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.arch == 'arm64' && '11.0' || '10.15' }}
      VCPKG_TRIPLET: ${{ matrix.arch == 'arm64' && 'arm64-osx-dynamic-release' || 'x64-osx-dynamic-release' }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache dependencies
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-cache
          key: vcpkg-native-${{ env.VCPKG_TRIPLET }}-${{ hashFiles('vcpkg.json', 'vcpkg/triplets/*') }}-${{ github.run_id }}
          restore-keys: vcpkg-native-${{ env.VCPKG_TRIPLET }}-${{ hashFiles('vcpkg.json', 'vcpkg/triplets/*') }}-
      - name: Build tools
        run: brew install ninja automake autoconf autoconf-archive libtool pkg-config
      - name: Verify packaging checks
        run: python3 utils/tests/test_macos_bundle.py
      - name: Pinned vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout 66c0373dc7fca549e5803087b9487edfe3aca0a1
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ env.VCPKG_TRIPLET }} \
            -DVCPKG_HOST_TRIPLET=${{ env.VCPKG_TRIPLET }} \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ env.MACOSX_DEPLOYMENT_TARGET }} \
            -DWITH_XC_ALL=ON -DWITH_XC_DOCS=OFF -DWITH_XC_UPDATECHECK=OFF \
            -DWITH_TESTS=ON -DWITH_GUI_TESTS=ON -DWITH_XC_NETWORKING=ON \
            -DKEEPASSXC_BUILD_TYPE=Release
      - name: Save compiled dependencies
        if: always()
        uses: actions/cache/save@v4
        with:
          path: vcpkg-cache
          key: vcpkg-native-${{ env.VCPKG_TRIPLET }}-${{ hashFiles('vcpkg.json', 'vcpkg/triplets/*') }}-${{ github.run_id }}
      - name: Compile
        run: cmake --build build --parallel 3
      - name: Test
        env:
          QT_QPA_PLATFORM: cocoa
          KEYSTONE_CAPTURE_DIR: ${{ github.workspace }}/dist
        run: ctest --test-dir build --output-on-failure --parallel 1
      - name: Package
        run: bash utils/package-keystone-macos.sh '${{ matrix.arch }}'
      - name: Preserve app for GUI diagnosis
        if: failure()
        run: |
          if test -d build/src/Keystone.app; then
            cmake --install build --prefix "$PWD/build/diagnostic"
            codesign --force --deep --sign - build/diagnostic/Keystone.app
            mkdir -p diagnostics
            ditto -c -k --sequesterRsrc --keepParent build/diagnostic/Keystone.app diagnostics/Keystone-diagnostic.zip
          fi
      - name: Upload packages and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Keystone-${{ matrix.arch }}
          path: |
            dist/*
            diagnostics/*.zip
            build/Testing/Temporary/LastTest.log
            build/vcpkg-manifest-install.log
          if-no-files-found: warn
